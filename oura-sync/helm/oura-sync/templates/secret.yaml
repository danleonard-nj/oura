{{/*
Rendered only when secret values are supplied inline and `existingSecret` is
unset. The preferred path is `existingSecret`, so credentials never pass
through values files or Helm release history.
*/}}
{{- if eq (include "oura-sync.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oura-sync.fullname" . }}
  labels:
    {{- include "oura-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.ouraClientId }}
  OURA_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ouraClientSecret }}
  OURA_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ouraRedirectUri }}
  OURA_REDIRECT_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.tokenEncryptionKey }}
  TOKEN_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mongodbUri }}
  MONGODB_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisUrl }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aadTenantId }}
  AAD_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aadAudience }}
  AAD_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aadRequiredRole }}
  AAD_REQUIRED_ROLE: {{ . | quote }}
  {{- end }}
{{- end }}
