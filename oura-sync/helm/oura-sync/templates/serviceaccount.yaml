{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oura-sync.serviceAccountName" . }}
  labels:
    {{- include "oura-sync.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application talks to Mongo, Redis and Oura only; it never calls the
# Kubernetes API, so it does not need a mounted token.
automountServiceAccountToken: false
{{- end }}
