# Default values for oura-sync.

replicaCount: 1

image:
  repository: azureks.azurecr.io/oura/oura-sync
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: "oura-sync"
fullnameOverride: "oura-sync"

serviceAccount:
  create: true
  name: "oura-sync"
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ── Application configuration ─────────────────────────────────────────────
# None here. Every application setting -- secrets included -- is in
# config.json, which CI/CD drops into the image build (see the Dockerfile and
# config.example.json). The chart only describes how the pod runs: no
# ConfigMap, no Secret, nothing for the two to drift on.

# ── Probes ────────────────────────────────────────────────────────────────
# /health is dependency-free so a Mongo or Redis blip cannot cause a restart
# loop. /ready checks Mongo and Redis and removes the pod from the Service.
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Matches the uid/gid baked into the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10002
  runAsGroup: 10002
  fsGroup: 10002
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Long enough for Hypercorn's --graceful-timeout of 25s to finish draining.
terminationGracePeriodSeconds: 30

# ── Ingress ───────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  hostname: oura.example.com
  path: /
  pathType: Prefix
  # Streamable HTTP holds a response open while a tool runs, so proxy read and
  # send timeouts must be generous and response buffering must be off, or the
  # proxy will cut the stream mid-call. The defaults below are ingress-nginx
  # annotations; see the README for Traefik and HAProxy equivalents. Replace
  # them wholesale if you run a different controller.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  tls:
    enabled: false
    secretName: ""
    # This cluster has no ClusterIssuers -- every namespace carries its own
    # cert-manager Issuer, so the ingress is annotated `cert-manager.io/issuer`.
    # A `cluster-issuer` annotation here would silently never issue a cert.
    issuerName: letsencrypt-prod
    # Create the Issuer as part of this release. Set false if the namespace
    # already has one with this name.
    createIssuer: true
    email: ""
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    accountKeySecretName: letsencrypt-tls-prod

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Keeps a replica available during voluntary disruption once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
