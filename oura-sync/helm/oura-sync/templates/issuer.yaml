{{/*
A namespaced cert-manager Issuer, matching the pattern used by the other
namespaces in this cluster (api-gateway, gateway, kube-tools, site, ...).

Namespaced rather than a ClusterIssuer because that is what exists here: there
are no ClusterIssuers, so an ingress annotated `cert-manager.io/cluster-issuer`
would silently never get a certificate. Each namespace carries its own Issuer
and its own ACME account key.
*/}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.createIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.ingress.tls.issuerName }}
  labels:
    {{- include "oura-sync.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ required "ingress.tls.email is required to create an Issuer" .Values.ingress.tls.email | quote }}
    server: {{ .Values.ingress.tls.acmeServer | quote }}
    preferredChain: ""
    privateKeySecretRef:
      # Holds the ACME account key for this namespace. cert-manager creates it.
      name: {{ .Values.ingress.tls.accountKeySecretName }}
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className | default "nginx" }}
{{- end }}
