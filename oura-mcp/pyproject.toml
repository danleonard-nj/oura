[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oura-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing Oura Ring API v2 data"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dan Leonard", email = "dcl525@gmail.com" }]

dependencies = [
    "mcp>=2.1.1,<3",
    "hypercorn>=0.17",
    "starlette>=0.41",
    "httpx2>=2.5",
    "pymongo>=4.9",
    "redis>=5.0",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydepi>=0.1.0",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oura_mcp = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# oura-common is a plain shared source tree, not an installed package (see
# oura-common/oura_common/__init__.py) -- this is how pytest finds it. Running
# the app itself (not under pytest) needs the same directory on PYTHONPATH;
# see README.md.
pythonpath = ["../oura-common/src"]
