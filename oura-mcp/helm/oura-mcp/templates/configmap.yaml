apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oura-mcp.fullname" . }}
  labels:
    {{- include "oura-mcp.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MONGODB_DATABASE: {{ .Values.config.mongodbDatabase | quote }}
  OURA_ACCOUNT_ID: {{ .Values.config.ouraAccountId | quote }}
  OURA_SCOPES: {{ .Values.config.ouraScopes | quote }}
  MCP_PATH: {{ .Values.config.mcpPath | quote }}
  MCP_STATELESS: {{ .Values.config.mcpStateless | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
  {{- with (include "oura-mcp.publicHost" .) }}
  PUBLIC_HOST: {{ . | quote }}
  {{- end }}
  {{- with (include "oura-mcp.redirectUri" .) }}
  OURA_REDIRECT_URI: {{ . | quote }}
  {{- end }}
