[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oura-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing Oura Ring API v2 data"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dan Leonard", email = "dcl525@gmail.com" }]

dependencies = [
    "mcp>=2.1.1,<3",
    "oura-ring>=0.3.0,<1",
    "hypercorn>=0.17",
    "starlette>=0.41",
    "pymongo>=4.9",
    "redis>=5.0",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydepi>=0.1.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
