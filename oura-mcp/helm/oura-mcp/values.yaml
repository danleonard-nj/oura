# Default values for oura-mcp.

replicaCount: 1

image:
  repository: azureks.azurecr.io/oura/oura-mcp
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: "oura-mcp"
fullnameOverride: "oura-mcp"

serviceAccount:
  create: true
  name: "oura-mcp"
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ── Application configuration ─────────────────────────────────────────────
# Non-secret values only. Everything sensitive comes from `secrets` below.
config:
  # The ingress hostname, no scheme. REQUIRED in production: the MCP
  # transport's DNS-rebinding protection rejects any Host header not on its
  # allowlist, and this is what populates it. Defaults to ingress.hostname.
  publicHost: "oura.dan-leonard.com"
  logLevel: INFO
  mongodbDatabase: oura_mcp
  ouraAccountId: default
  # stress, heart_health and ring_configuration are undocumented but required
  # by daily_resilience, cardiovascular age / VO2 max, and ring info.
  ouraScopes: "email personal daily heartrate workout tag session spo2 stress heart_health ring_configuration"
  # Full callback URL registered on the Oura OAuth application.
  ouraRedirectUri: "https://oura.dan-leonard.com/oauth/callback"
  mcpPath: /mcp
  # Extra Host values the MCP transport accepts, comma-separated. Needed
  # when a reverse proxy rewrites Host -- e.g. routing /mcp through the
  # api-gateway, which forwards to the cluster-internal service name.
  mcpExtraAllowedHosts: "oura-mcp.oura.svc.cluster.local"
  # Stateless keeps no session state in a replica's memory, so no sticky
  # sessions are needed and any replica can serve any request.
  mcpStateless: true
  cacheEnabled: true
  # Extra plain environment variables, as name/value pairs.
  extraEnv: []

# ── Secrets ───────────────────────────────────────────────────────────────
# Preferred: reference a Secret you already manage.
#
#   existingSecret: oura-shared   # shared with oura-sync -- see ../../push-secret.bat
#
# The Secret must contain these keys:
#   OURA_CLIENT_ID, OURA_CLIENT_SECRET, MCP_API_KEY, TOKEN_ENCRYPTION_KEY,
#   MONGODB_URI, REDIS_URL, and optionally OURA_WEBHOOK_VERIFICATION_TOKEN
#   and MCP_OWNER_PASSWORD (the latter enables MCP OAuth).
#
# Alternatively set the values under `secrets` and the chart renders a Secret.
# Anything left empty is omitted, so it can come from `existingSecret` instead.
# Values supplied this way land in your Helm release history in plain text --
# prefer existingSecret for anything long-lived.
existingSecret: ""

secrets:
  ouraClientId: ""
  ouraClientSecret: ""
  mcpApiKey: ""
  tokenEncryptionKey: ""
  # Mongo and Redis already exist in the cluster; this chart does not deploy
  # them. Supply their connection strings here or via existingSecret.
  mongodbUri: ""
  redisUrl: ""
  ouraWebhookVerificationToken: ""
  # Set to enable MCP OAuth, which is what ChatGPT and other
  # discovery-only clients require. Typed on the consent screen to approve
  # an authorization; generate it like an API key, not a memorable password.
  mcpOwnerPassword: ""

# ── Probes ────────────────────────────────────────────────────────────────
# /health is dependency-free so a Mongo or Redis blip cannot cause a restart
# loop. /ready checks Mongo and Redis and removes the pod from the Service.
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Matches the uid/gid baked into the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Long enough for Hypercorn's --graceful-timeout of 25s to finish draining.
terminationGracePeriodSeconds: 30

# ── Ingress ───────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  hostname: oura-mcp.example.com
  path: /
  pathType: Prefix
  # Streamable HTTP holds a response open while a tool runs, so proxy read and
  # send timeouts must be generous and response buffering must be off, or the
  # proxy will cut the stream mid-call. The defaults below are ingress-nginx
  # annotations; see the README for Traefik and HAProxy equivalents. Replace
  # them wholesale if you run a different controller.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  tls:
    enabled: false
    secretName: ""
    # This cluster has no ClusterIssuers -- every namespace carries its own
    # cert-manager Issuer, so the ingress is annotated `cert-manager.io/issuer`.
    # A `cluster-issuer` annotation here would silently never issue a cert.
    issuerName: letsencrypt-prod
    # Create the Issuer as part of this release. Set false if the namespace
    # already has one with this name.
    createIssuer: true
    email: ""
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    accountKeySecretName: letsencrypt-tls-prod

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Keeps a replica available during voluntary disruption once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
