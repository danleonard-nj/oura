# Default values for oura-sync.

replicaCount: 1

image:
  repository: azureks.azurecr.io/oura/oura-sync
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: "oura-sync"
fullnameOverride: "oura-sync"

serviceAccount:
  create: true
  name: "oura-sync"
  annotations: {}

# ClusterIP only, deliberately -- this service is reached through the
# internal API gateway or from inside the cluster (oura-mcp), never directly
# from outside it. No ingress/TLS templates in this chart.
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ── Application configuration ─────────────────────────────────────────────
# Non-secret values only. Everything sensitive comes from `secrets` below.
config:
  logLevel: INFO
  mongodbDatabase: oura_mcp
  ouraAccountId: default
  # Space-separated -> the chart joins these with commas for SYNC_RESOURCES.
  syncResources:
    - ring_configuration
    - ring_battery_level
    - personal_info
  # Extra plain environment variables, as name/value pairs.
  extraEnv: []

# ── Secrets ───────────────────────────────────────────────────────────────
# Preferred: reference a Secret you already manage.
#
#   existingSecret: oura-shared   # shared with oura-mcp -- see ../../push-secret.bat
#
# The Secret must contain: OURA_CLIENT_ID, OURA_CLIENT_SECRET, OURA_REDIRECT_URI,
# TOKEN_ENCRYPTION_KEY, MONGODB_URI, REDIS_URL, AAD_TENANT_ID, AAD_AUDIENCE
# (and optionally AAD_REQUIRED_ROLE).
#
# Alternatively set the values under `secrets` and the chart renders a Secret.
# Anything left empty is omitted, so it can come from `existingSecret` instead.
# Values supplied this way land in your Helm release history in plain text --
# prefer existingSecret for anything long-lived.
existingSecret: ""

secrets:
  ouraClientId: ""
  ouraClientSecret: ""
  ouraRedirectUri: ""
  tokenEncryptionKey: ""
  # Mongo and Redis already exist in the cluster; this chart does not deploy
  # them, and this is the same database oura-mcp uses.
  mongodbUri: ""
  redisUrl: ""
  # This deployment's own Azure AD app registration -- what callers
  # (the C# cron scheduler, oura-mcp) must present a token for.
  aadTenantId: ""
  aadAudience: ""
  aadRequiredRole: ""

# ── Probes ────────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Matches the uid/gid baked into the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10002
  runAsGroup: 10002
  fsGroup: 10002
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Keeps a replica available during voluntary disruption once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
